<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 탁구센터</title><link rel="stylesheet" href="/style.css"></head><body class="login-body"><section class="login-card"><a class="brand" href="/">◒ <span>탁구센터<small>CLUB MANAGER</small></span></a><h1 id="login-title">로그인</h1><p id="login-help">회원·코치 또는 관리자 계정으로 로그인하세요.</p><div class="tabs" id="login-tabs"><button type="button" data-role="member" class="selected">회원·코치 로그인</button><button type="button" data-role="admin">관리자 로그인</button></div><form id="login-form"><label id="phone-label">전화번호<input name="phone" type="tel" autocomplete="username" placeholder="등록된 전화번호"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="setup-hint" hidden>관리자가 센터 PC에서 처음 한 번 설정하세요. 8자 이상 비밀번호를 안전하게 보관해주세요. 기존 회원 데이터는 유지됩니다.</p><button class="primary" type="submit" id="login-submit">로그인</button><p id="login-error" role="alert"></p></form><p class="login-note">회원 계정은 센터 관리자에게 등록을 요청해주세요.<br>다른 사람과 함께 쓰는 기기에서는 사용 후 로그아웃하세요.</p></section><script type="module" src="/login.js"></script></body></html>
